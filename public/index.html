<!DOCTYPE html>
<html>
<head>

    <title>Hometown Success for Team USA | hometownsuccess.com</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #map-container { flex: 2; height: 100%; }
        #sidebar { flex: 1; height: 100%; background: #f8f9fa; border-left: 2px solid #ddd; padding: 30px; overflow-y: auto; box-sizing: border-box; }
        .stat-box { display: inline-block; padding: 10px 15px; border-radius: 8px; margin-right: 15px; margin-bottom: 20px; }
        .bg-blue { background-color: #e8f0fe; }
        .bg-red { background-color: #fce8e6; }
        .insight-text p { line-height: 1.6; color: #3c4043; }
    </style>
    <meta name="description" content="Discover how geography shapes greatness. Powered by Gemini, this tool maps Team USA hometowns to highlight inclusive Athlete Hubs across the American landscape.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hometownsuccess.com/">
    <meta property="og:title" content="Hometown Success | hometownsuccess.com">
    <meta property="og:description" content="Discover how geography shapes greatness. Powered by Gemini, this tool maps Team USA hometowns to highlight inclusive Athlete Hubs across the American landscape.">
<!-- <meta property="og:image" content="https://hometownsuccess.com/your-cover-image.jpg"> -->
</head>
<body>

    <div id="map-container"></div>

    <div id="sidebar">
        <h2 style="color: #202124; margin-bottom: 5px;">Hometown Success Engine for Team USA — Powered by Gemini</h2>
        <p style="color: #5f6368; font-size: 14px; margin-top: 0;">Athlete data from TeamUSA.com</p>
        <p style="color: #5f6368; font-size: 14px; margin-top: 0;">Powered by Google BigQuery & Gemini Vertex AI</p>
        
        <div id="content-area" style="margin-top: 50px; text-align: center; color: #80868b;">
            <h3>Select a Hub on the Map</h3>
            <p>Click any pin to generate an AI narrative.</p>
        </div>
    </div>

    <script>
        let map;

        // 1. Initialize the Google Map
        async function initMap() {
            map = new google.maps.Map(document.getElementById("map-container"), {
                center: { lat: 39.8283, lng: -98.5795 }, // Center of USA
                zoom: 4,
                mapId: "HOMETOWNSUCCESS"
            });

            // 2. Fetch all hubs from your Python backend
            try {
                const response = await fetch("https://hometown-success-engine-583694496401.us-west2.run.app/api/hubs");
                const hubs = await response.json();
                
                // 3. Loop through the hubs and drop a pin for each
                hubs.forEach(hub => {
                    // Calculate a rough size multiplier based on athletes
                    const scaleSize = Math.min(15, Math.max(5, hub.athletes / 5));

                    const marker = new google.maps.Marker({
                        position: { lat: hub.lat, lng: hub.lng },
                        map: map,
                        title: hub.city,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: scaleSize,
                            fillColor: "#1a73e8",
                            fillOpacity: 0.8,
                            strokeColor: "#ffffff",
                            strokeWeight: 1
                        }
                    });

                    // Initialize the Clusterer
                    const markerCluster = new markerClusterer.MarkerClusterer({ 
                        HOMETOWNSUCCESS, 
                        marker
                    });

                    // 4. Listen for clicks on the pins
                    marker.addListener("click", () => {
                        fetchHubData(hub.city);
                    });
                });
            } catch (error) {
                console.error("Error loading initial hubs:", error);
                document.getElementById("content-area").innerHTML = "<p style='color:red;'>Make sure your Python server is running!</p>";
            }
        }

        // 5. Fetch Vertex AI data when a pin is clicked
        async function fetchHubData(cityName) {
            const contentArea = document.getElementById("content-area");
            contentArea.innerHTML = `<h3>Analyzing ${cityName}...</h3><p>Consulting Vertex AI...</p>`;

            try {
                const response = await fetch(`https://hometown-success-engine-583694496401.us-west2.run.app/api/hub/${cityName}`);
                const data = await response.json();

                // Format the AI narrative paragraphs
                const paragraphs = data.insight.split('\n\n').map(p => `<p>${p}</p>`).join('');

                // Update the sidebar with the new data
                contentArea.innerHTML = `
                    <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: left;">
                        <h1 style="color: #1a73e8; margin-top: 0;">${data.stats.city}, ${data.stats.state}</h1>
                        
                        <div class="stat-box bg-blue"><strong>Athletes:</strong> ${data.stats.total_athletes}</div>
                        <div class="stat-box bg-red"><strong>Medals:</strong> ${data.stats.total_medals}</div>

                        <h4 style="color: #5f6368; margin-bottom: 5px;">Dominant Sports</h4>
                        <p style="margin-top: 0; font-weight: 500;">${data.stats.clustered_sports}</p>

                        <h4 style="border-bottom: 2px solid #1a73e8; padding-bottom: 5px; margin-top: 30px;">Vertex AI Insight</h4>
                        <div class="insight-text">${paragraphs}</div>
                    </div>
                `;
            } catch (error) {
                contentArea.innerHTML = `<p style='color:red;'>Error fetching data for ${cityName}</p>`;
            }
        }
    </script>

    <!-- Load the Google Maps JavaScript MarkerClusterer -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBGAOTEdGqYEYGY4oGWUSLp534PKj2-lXA&callback=initMap"></script>
</body>
</html>
